name: CI

# Validation only. Nothing here publishes the site; deployment lives in pages.yml. No
# release, no push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Generated data files are in sync with source/
        run: |
          node tools/build-content.js
          node tools/build-maps.js
          git diff --exit-code -- lms
      - run: npm run check:syntax
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Package the allow-listed site (not published)
        run: npm run build:site
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
