name: Deploy to GitHub Pages

# Publishes only what tools/build-site.js allow-lists (the runtime app under lms/).
# Includes the verified question bank (lms/bank/). Raw sources in question-bank/ are gitignored.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generated data files are in sync with source/
        run: |
          node tools/build-content.js
          node tools/build-maps.js
          git diff --exit-code -- lms
      - run: npm run check:syntax
      - run: npm run test:unit
      - name: Build the allow-listed site
        run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
